; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Parent folder holding every firmware variant. Which one actually gets
; built is picked per-environment below via build_src_filter, so switching
; variants is just switching environment (-e ..., or the env dropdown in
; the VS Code PlatformIO extension) - no file copying or editing needed.
src_dir = on ESP32
default_envs = ap-dashboard

; Shared settings inherited by every [env:...] below
[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    ArduinoJson
    ESP32Servo

; ================= Variants =================

; Active: ESP32-S3 as its own Wi-Fi Access Point + web dashboard (LPF)
[env:ap-dashboard]
build_src_filter = -<*> +<AP Dashboard/esp32-smartphone-control-AP.cpp>

; ESP32-S3 as its own Wi-Fi Access Point + web dashboard (Kalman)
[env:ap-dashboard-kalman]
build_src_filter = -<*> +<AP Dashboard/esp32-smartphone-control-APkm.cpp>

; Phone-hotspot (STA) version with low-pass filter + deadband + rate limiter
[env:lpf]
build_src_filter = -<*> +<LPF/esp32-smartphone-control-2.cpp>

; Phone-hotspot (STA) version, earlier/simpler pass (no LPF pipeline)
[env:lpf-basic]
build_src_filter = -<*> +<LPF/esp32-smartphone-control.cpp>

; Phone-hotspot (STA) version using a Kalman filter instead of LPF
[env:kalman]
build_src_filter = -<*> +<Kalman Filter/*>
